name: Apply Sync Integrity Sprint 1.2

on:
  push:
    branches:
      - stabilization/field-release
    paths:
      - scripts/apply_sync_integrity_sprint_1_2.py
      - .github/workflows/apply-sync-integrity-sprint-1-2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/field-release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Sprint 1.2
        run: python scripts/apply_sync_integrity_sprint_1_2.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oropeza/urbanapp/asd/data/local/entities.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/data/local/AppDatabase.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/data/local/DbProvider.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/data/local/SyncQueueIntegrityMigrations.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/data/local/dao.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/data/repository/repository.kt \
                  app/src/main/java/com/oropeza/urbanapp/asd/sync/cloud/CloudSyncEngine.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(sync): enforce trip ownership and recover stale queue items"
            git push origin HEAD:stabilization/field-release
          fi
