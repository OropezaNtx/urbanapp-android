name: Apply field sprint 1

on:
  push:
    branches:
      - stabilization/field-release

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[field-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/field-release
          fetch-depth: 0

      - name: Apply offline-first field fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # 1) Trip creation must never wait for GPS.
          p = root / 'app/src/main/java/com/oropeza/urbanapp/asd/ui/viewmodel/AsdNewTripScreen.kt'
          text = p.read_text(encoding='utf-8-sig')
          marker = 'private suspend fun createTripFlow('
          if marker not in text:
              raise SystemExit('createTripFlow marker not found')
          prefix = text.split(marker, 1)[0]
          replacement = r'''private suspend fun createTripFlow(
              vm: AsdNewTripVM,
              gps: LocationProvider,
              planningRouteId: String,
              routeName: String,
              company: String,
              vehicleEco: String,
              direction: String,
              notes: String,
              aforador: String,
              supervisor: String,
              deviceNumber: String,
              observerSex: String,
              routeNumberTxt: String,
              esFs: String,
              baseStart: String,
              baseEnd: String,
              plateNumber: String,
              vehicleType: String,
              seatCapacityTxt: String,
              continueWaypoints: Boolean,
              onCreated: (Long) -> Unit,
              setLoading: (Boolean) -> Unit,
              setGpsMsg: (String?) -> Unit,
              setError: (String?) -> Unit
          ) {
              try {
                  setLoading(true)
                  setError(null)
                  setGpsMsg("Recorrido creado. GPS pendiente de adquisición…")

                  val now = System.currentTimeMillis()
                  val id = vm.createWithFix(
                      planningRouteId = planningRouteId.trim(),
                      stopLat = 0.0,
                      stopLon = 0.0,
                      stopAltM = 0.0,
                      stopAccM = 0.0,
                      stopProvider = "pending",
                      stopFixTime = now,
                      locationStatus = "GPS_PENDING",
                      routeName = routeName.trim(),
                      company = company.ifBlank { null },
                      vehicleEco = vehicleEco.ifBlank { null },
                      direction = direction,
                      notes = notes.ifBlank { null },
                      routeNumber = routeNumberTxt.trim().toIntOrNull(),
                      esFs = esFs.ifBlank { null },
                      baseStart = baseStart.ifBlank { null },
                      baseEnd = baseEnd.ifBlank { null },
                      plateNumber = plateNumber.ifBlank { null },
                      vehicleType = vehicleType.ifBlank { null },
                      seatCapacity = seatCapacityTxt.trim().toIntOrNull(),
                      aforador = aforador.ifBlank { null },
                      supervisor = supervisor.ifBlank { null },
                      deviceNumber = deviceNumber.ifBlank { null },
                      observerSex = observerSex,
                      continueWaypoints = continueWaypoints
                  )

                  setLoading(false)
                  onCreated(id)
              } catch (e: Exception) {
                  setLoading(false)
                  setGpsMsg(null)
                  setError(e.message ?: "Error al crear el recorrido.")
              }
          }
          '''
          p.write_text(prefix + replacement, encoding='utf-8')

          # 2) Event capture persists immediately with the best already-known fix.
          p = root / 'app/src/main/java/com/oropeza/urbanapp/asd/ui/viewmodel/AsdTripDetailScreen.kt'
          text = p.read_text(encoding='utf-8-sig')
          start = text.find('    fun saveEvent() {')
          end = text.find('\n    val exportCsv', start)
          if start < 0 or end < 0:
              raise SystemExit('saveEvent block not found')
          save_event = r'''    fun saveEvent() {
              val err = validateCapture(summary, trip)
              if (err != null) {
                  scope.launch { snackbarHostState.showSnackbar(err) }
                  return
              }

              val now = System.currentTimeMillis()
              val endFix = currentFix(now)
              val startFix = LocationFix(
                  activeDelayLat,
                  activeDelayLon,
                  activeDelayAccM,
                  activeDelayAltM,
                  activeDelayProvider.ifBlank { "pending" },
                  if (activeDelayFixTime > 0L) activeDelayFixTime else now,
                  activeDelayStatus
              )

              scope.launch {
                  loadingGps = true
                  gpsMsg = if (endFix.status == "GPS_PENDING") {
                      "Guardando localmente; ubicación pendiente…"
                  } else {
                      "Guardando registro…"
                  }
                  try {
                      vm.addStopDetailed(
                          tripId,
                          if (menUp + womenUp + menDown + womenDown > 0) "ASD" else "DEMORA",
                          activeDelayStartMs,
                          now,
                          stopName.trim(),
                          notes.trim(),
                          menUp,
                          womenUp,
                          menDown,
                          womenDown,
                          hasLuggage,
                          selectedDelayCodes.joinToString("/").ifBlank { null },
                          otherDelayDesc.trim().ifBlank { null },
                          startFix,
                          endFix
                      )
                      resetCapture()
                      snackbarHostState.showSnackbar(
                          if (endFix.status == "GPS_PENDING")
                              "Registro guardado localmente; GPS pendiente ✅"
                          else
                              "Registro guardado ✅"
                      )
                  } catch (t: Throwable) {
                      snackbarHostState.showSnackbar("No se pudo guardar el registro: ${t.message ?: "error desconocido"}")
                  } finally {
                      loadingGps = false
                      gpsMsg = null
                  }
              }
          }
          '''
          text = text[:start] + save_event + text[end:]

          old_effect = '    LaunchedEffect(tripId, trip?.endTime) { if (trip?.endTime == null) startTS() else stopTS() }'
          new_effect = '''    LaunchedEffect(tripId, trip?.endTime) {
              if (trip?.endTime == null) {
                  startTS()
              } else {
                  stopTS()
                  snackbarHostState.showSnackbar("Recorrido finalizado ✅")
                  onBack()
              }
          }'''
          if old_effect not in text:
              raise SystemExit('trip end effect not found')
          text = text.replace(old_effect, new_effect, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Give GPS backfill enough time to enrich events recorded in difficult areas.
          p = root / 'app/src/main/java/com/oropeza/urbanapp/asd/data/repository/repository.kt'
          text = p.read_text(encoding='utf-8-sig')
          if 'getPendingGpsEvents(tripId, limit = 10)' not in text:
              raise SystemExit('pending GPS query not found')
          if 'if (diffMs <= 30_000L)' not in text:
              raise SystemExit('GPS backfill window not found')
          text = text.replace('getPendingGpsEvents(tripId, limit = 10)', 'getPendingGpsEvents(tripId, limit = 50)', 1)
          text = text.replace('if (diffMs <= 30_000L)', 'if (diffMs <= 5 * 60_000L)', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "Afora Stabilization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/oropeza/urbanapp/asd/ui/viewmodel/AsdNewTripScreen.kt \
            app/src/main/java/com/oropeza/urbanapp/asd/ui/viewmodel/AsdTripDetailScreen.kt \
            app/src/main/java/com/oropeza/urbanapp/asd/data/repository/repository.kt
          git commit -m "fix(field): persist trips and events without GPS [field-fix]"
          git push origin HEAD:stabilization/field-release
