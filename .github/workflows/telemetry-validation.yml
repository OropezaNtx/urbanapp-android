name: Telemetry Validation

on:
  push:
    branches:
      - feature/tracking-integrity-pipeline
  workflow_dispatch:

jobs:
  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Android
        run: ./gradlew :app:assembleDebug --stacktrace

  web-build:
    name: Operations Center build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/urban-operations-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build
